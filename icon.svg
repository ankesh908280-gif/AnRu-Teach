<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#ff334b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#121216" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#neonGrad)" stroke-width="6" opacity="0.8" />
  
  <!-- Slide Board -->
  <rect x="80" y="90" width="352" height="260" rx="24" fill="#1c1c26" stroke="#b388ff" stroke-width="5" filter="url(#glow)"/>
  
  <!-- Stylized Annotation Wave -->
  <path d="M 120 230 Q 180 150 240 230 T 360 210" fill="none" stroke="#00e5ff" stroke-width="12" stroke-linecap="round" />
  
  <!-- Pen Stylus -->
  <path d="M 330 310 L 400 240 L 420 260 L 350 330 Z" fill="#ff334b" />
  <polygon points="330,310 320,335 345,325" fill="#ffd600" />
  
  <!-- App Label -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="4">AnRu TEACH</text>
  <circle cx="395" cy="405" r="7" fill="#00e5ff" filter="url(#glow)"/>
</svg>